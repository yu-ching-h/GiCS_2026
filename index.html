<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧運動科技 - UEBA AI 行為分析即時主控台 (Demo)</title>
    <style>
        :root {
            --bg-color: #060b16;
            --text-color: #00f0ff;
            --panel-bg: rgba(12, 22, 45, 0.85);
            --border-color: #005577;
            --alert-color: #ff3333;
            --success-color: #33ff33;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace, "Microsoft JhengHei";
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
            padding: 25px;
            border-radius: 8px;
            transition: all 0.5s ease;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 0;
            letter-spacing: 2px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
            text-shadow: 0 0 10px var(--text-color);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.4);
            padding: 12px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .status-indicator {
            font-weight: bold;
            color: var(--success-color);
        }

        .monitor-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .log-panel {
            background: #02050a;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            font-size: 14px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .log-line {
            margin: 5px 0;
            padding: 4px 8px;
            border-radius: 3px;
            border-left: 3px solid #666;
            animation: fadeIn 0.3s ease;
        }

        .log-safe {
            background: rgba(51, 255, 51, 0.05);
            border-left-color: var(--success-color);
            color: #a3ffa3;
        }

        .log-danger {
            background: rgba(255, 51, 51, 0.12);
            border-left-color: var(--alert-color);
            color: #ff8888;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .control-zone {
            text-align: center;
            margin-top: 25px;
        }

        .btn-start {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 12px 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            transition: all 0.3s;
        }

        .btn-start:hover {
            background: var(--text-color);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--text-color);
        }

        .blockade-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 0, 0, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 5px solid var(--alert-color);
            box-sizing: border-box;
        }

        .blockade-box {
            text-align: center;
            color: var(--alert-color);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.98); text-shadow: 0 0 10px rgba(255,51,51,0.5); }
            100% { transform: scale(1.02); text-shadow: 0 0 30px rgba(255,51,51,1); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>【智慧運動科技 - UEBA AI 行為分析即時主控台】</h1>
    
    <div class="status-bar">
        <div>👤 目前登入令牌擁有者：<span style="color:#fff;">小明 (Xiao-Ming)</span></div>
        <div>系統防禦狀態：<span class="status-indicator" id="systemStatus">🟢 監控中 (MONITORING)</span></div>
    </div>

    <div class="monitor-grid">
        <div style="margin-bottom: 5px;">📡 核心 AI 串流行為特徵審查日誌 (Real-time UEBA Log):</div>
        <div class="log-panel" id="logPanel">
            <div style="color: #666;">[系統提示] 等待防禦端點啟動...</div>
        </div>
    </div>

    <div class="control-zone">
        <button class="btn-start" id="startBtn" onclick="startStreamingUEBA()">啟動即時行為防禦鏈</button>
    </div>
</div>

<div class="blockade-overlay" id="blockadeOverlay">
    <div class="blockade-box">
        <h1 style="font-size: 50px; color: var(--alert-color); border: none; text-shadow: 0 0 20px #ff0000;">⚠️ ACCESS DENIED ⚠️</h1>
        <p style="font-size: 24px; color: #fff;">[ UEBA 系統主動防禦：不合規行為特徵阻斷 ]</p>
        <p style="font-size: 18px; color: #aaa;" id="blockadeDetails">惡意流量特徵比對完成。帳號已即時自動鎖定，Token 立即失效！</p>
        <button style="margin-top:20px; background:#ff3333; color:#fff; border:none; padding:10px 20px; cursor:pointer; font-weight:bold;" onclick="closeOverlay()">重設防禦系統</button>
    </div>
</div>

<script>
    let timer = null;
    let tickCount = 0;
    
    // 💡 調整這裡可以決定小明正常狀態要維持多久 (秒數)
    const NORMAL_DURATION_SECONDS = 60; 

    function startStreamingUEBA() {
        document.getElementById('startBtn').disabled = true;
        document.getElementById('startBtn').style.opacity = '0.5';
        const logPanel = document.getElementById('logPanel');
        logPanel.innerHTML = '<div style="color: #00f0ff;">[系統初始化] AI 即時防禦常駐程式啟動，開始攔截行為特徵...</div>';
        
        tickCount = 0;
        // 每 0.5 秒驅動一次前端模擬分析
        timer = setInterval(simulateUEBAEngine, 500);
    }

    function simulateUEBAEngine() {
        tickCount++;
        let status = "safe";
        let probability = 0;
        let message = "";
        let userIdentity = "";
        let current_data = {};

        // 每秒跑 2 次 tick，所以乘 2
        const maxNormalTicks = NORMAL_DURATION_SECONDS * 2; 

        if (tickCount <= maxNormalTicks) {
            // 【正常時間內】：模擬小明本人的正常數據
            const simulatedSpeed = Math.floor(55 + Math.random() * 10); // 55~64字之間跳動
            current_data = { time: 21.2, speed: simulatedSpeed };
            userIdentity = "小明本人";
            status = "safe";
            probability = (Math.random() * 2.5).toFixed(1);
            message = "🟢 行為特徵完全符合使用者基準";
        } else {
            // 【超過設定時間】：模擬駭客突發流量
            current_data = { time: 3.25, speed: 600 };
            userIdentity = "☠️ 突發異常流量(Token持有者)";
            status = "danger";
            probability = (98.5 + Math.random() * 1.3).toFixed(1);
            message = "🚨 偵測到行為特徵劇烈異變！Token 被冒用！";
        }

        // 渲染日誌到網頁畫面上
        const logPanel = document.getElementById('logPanel');
        const now = new Date().toLocaleTimeString();
        const logLine = document.createElement('div');
        logLine.className = `log-line ${status === 'danger' ? 'log-danger' : 'log-safe'}`;
        
        logLine.innerHTML = `
            [${now}] 來源標籤: ${userIdentity} | 
            傳入特徵 -> 登入時間: ${current_data.time} 點, 打字速度: ${current_data.speed}字/分 | 
            AI 判定: ${message} (遭冒用機率: ${probability}%)
        `;
        
        logPanel.appendChild(logLine);
        logPanel.scrollTop = logPanel.scrollHeight;

        // 異常阻斷機制
        if (status === 'danger') {
            clearInterval(timer);
            
            setTimeout(() => {
                // 計算實際被攔截的精確秒數 (觸發異常通常是在正常時間過後的 0.5 秒)
                const actionSecond = NORMAL_DURATION_SECONDS + 0.5;
                
                document.getElementById('systemStatus').innerText = "🔴 帳號已鎖定 (BLOCKED)";
                document.getElementById('systemStatus').style.color = "#ff3333";
                
                // 動態更新彈窗內的秒數文字
                document.getElementById('blockadeDetails').innerText = `偵測到當前流量與原用戶 Baseline 嚴重不符。AI 判定遭冒用率：${probability}%。系統已於第 ${actionSecond} 秒主動發射防禦指令，攔截詐騙訊息。`;
                document.getElementById('blockadeOverlay').style.display = 'flex';
            }, 800);
        }
    }

    function closeOverlay() {
        document.getElementById('blockadeOverlay').style.display = 'none';
        document.getElementById('startBtn').disabled = false;
        document.getElementById('startBtn').style.opacity = '1';
        document.getElementById('systemStatus').innerText = "🟢 監控中 (MONITORING)";
        document.getElementById('systemStatus').style.color = "#33ff33";
        document.getElementById('logPanel').innerHTML = '<div style="color: #666;">[系統提示] 等待防禦端點啟動...</div>';
    }
</script>

</body>
</html>
